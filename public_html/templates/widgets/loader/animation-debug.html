<!DOCTYPE html>
<html>
<head>
    <title>Animation Debug Test</title>
    <link rel="stylesheet" href="/templates/widgets/loader/loader.css">
    <link rel="stylesheet" href="/templates/widgets/loader/loader-fixes.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .test-item { 
            border: 2px solid #ddd; 
            padding: 20px; 
            text-align: center; 
            background: #f9f9f9;
            border-radius: 8px;
        }
        .test-item h3 { margin-top: 0; color: #333; }
        .animation-container { 
            height: 80px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: white;
            border: 1px solid #eee;
            margin: 10px 0;
            border-radius: 4px;
        }
        .controls { margin: 20px 0; }
        .btn { 
            margin: 5px; 
            padding: 8px 16px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .btn:hover { background: #0056b3; }
        #status { 
            padding: 15px; 
            background: #e9ecef; 
            border-radius: 4px; 
            margin: 20px 0; 
        }
    </style>
</head>
<body>
    <h1>Animation Debug Test</h1>
    
    <div id="status">Loading...</div>
    
    <div class="controls">
        <button class="btn" onclick="testAllAnimations()">Test All Animations</button>
        <button class="btn" onclick="clearAll()">Clear All</button>
        <button class="btn" onclick="showFullLoader('rings')">Show Full Loader (Rings)</button>
        <button class="btn" onclick="showFullLoader('dots')">Show Full Loader (Dots)</button>
        <button class="btn" onclick="hideFullLoader()">Hide Full Loader</button>
    </div>

    <div class="test-grid" id="testGrid">
        <!-- Animation tests will be inserted here -->
    </div>

    <script src="/templates/widgets/loader/loader.js"></script>
    
    <script>
        // Animation definitions matching the loader
        const animations = [
            { name: 'Spinning Rings', type: 'rings', description: 'Three spinning rings with different sizes' },
            { name: 'Bouncing Dots', type: 'dots', description: 'Three dots bouncing in sequence' },
            { name: 'Loading Bars', type: 'bars', description: 'Five vertical bars scaling up and down' },
            { name: 'Pulsing Circle', type: 'pulse', description: 'Single circle growing and shrinking' },
            { name: 'Wave Animation', type: 'wave', description: 'Seven bars creating wave motion' },
            { name: 'Orbital Motion', type: 'orbit', description: 'Three dots orbiting around center' },
            { name: 'Ripple Effect', type: 'ripple', description: 'Two expanding circular ripples' },
            { name: 'Bouncing Ball', type: 'bounce', description: 'Single ball bouncing up and down' },
            { name: 'Spiral Motion', type: 'spiral', description: 'Five dots moving in spiral pattern' },
            { name: 'Rotating Cube', type: 'cube', description: 'Cube with 3D rotation effect' }
        ];

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function createAnimationElement(type) {
            let container;
            
            switch (type) {
                case 'rings':
                    container = document.createElement('div');
                    container.className = 'spinner-rings spinner-element';
                    for (let i = 0; i < 3; i++) {
                        const ring = document.createElement('div');
                        ring.className = 'spinner-ring';
                        container.appendChild(ring);
                    }
                    break;
                    
                case 'dots':
                    container = document.createElement('div');
                    container.className = 'spinner-dots spinner-element';
                    for (let i = 0; i < 3; i++) {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        container.appendChild(dot);
                    }
                    break;
                    
                case 'bars':
                    container = document.createElement('div');
                    container.className = 'spinner-bars spinner-element';
                    for (let i = 0; i < 5; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'bar';
                        container.appendChild(bar);
                    }
                    break;
                    
                case 'pulse':
                    container = document.createElement('div');
                    container.className = 'spinner-pulse spinner-element';
                    const circle = document.createElement('div');
                    circle.className = 'pulse-circle';
                    container.appendChild(circle);
                    break;
                    
                case 'wave':
                    container = document.createElement('div');
                    container.className = 'spinner-wave spinner-element';
                    for (let i = 0; i < 7; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'wave-bar';
                        container.appendChild(bar);
                    }
                    break;
                    
                case 'orbit':
                    container = document.createElement('div');
                    container.className = 'spinner-orbit spinner-element';
                    for (let i = 0; i < 3; i++) {
                        const dot = document.createElement('div');
                        dot.className = 'orbit-dot';
                        container.appendChild(dot);
                    }
                    break;
                    
                case 'ripple':
                    container = document.createElement('div');
                    container.className = 'spinner-ripple spinner-element';
                    for (let i = 0; i < 2; i++) {
                        const ring = document.createElement('div');
                        ring.className = 'ripple-ring';
                        container.appendChild(ring);
                    }
                    break;
                    
                case 'bounce':
                    container = document.createElement('div');
                    container.className = 'spinner-bounce spinner-element';
                    const ball = document.createElement('div');
                    ball.className = 'bounce-ball';
                    container.appendChild(ball);
                    break;
                    
                case 'spiral':
                    container = document.createElement('div');
                    container.className = 'spinner-spiral spinner-element';
                    for (let i = 0; i < 5; i++) {
                        const dot = document.createElement('div');
                        dot.className = 'spiral-dot';
                        container.appendChild(dot);
                    }
                    break;
                    
                case 'cube':
                    container = document.createElement('div');
                    container.className = 'spinner-cube spinner-element';
                    break;
                    
                default:
                    container = document.createElement('div');
                    container.textContent = 'Unknown animation: ' + type;
            }
            
            return container;
        }

        function testAllAnimations() {
            updateStatus('Creating all animation tests...');
            
            // Set CSS variables
            document.documentElement.style.setProperty('--loader-primary', '#3b82f6');
            document.documentElement.style.setProperty('--loader-secondary', '#7c3aed');
            document.documentElement.style.setProperty('--loader-tertiary', '#f59e0b');
            document.documentElement.style.setProperty('--loader-speed', '1s');
            
            const grid = document.getElementById('testGrid');
            grid.innerHTML = '';
            
            animations.forEach(anim => {
                const testItem = document.createElement('div');
                testItem.className = 'test-item';
                
                testItem.innerHTML = `
                    <h3>${anim.name}</h3>
                    <div class="animation-container" id="container-${anim.type}">
                        <!-- Animation will be inserted here -->
                    </div>
                    <p><small>${anim.description}</small></p>
                    <button class="btn" onclick="testSingle('${anim.type}')">Test ${anim.type}</button>
                `;
                
                grid.appendChild(testItem);
                
                // Create and insert animation
                const container = document.getElementById(`container-${anim.type}`);
                const animElement = createAnimationElement(anim.type);
                container.appendChild(animElement);
            });
            
            updateStatus('All animations created. Check each one to see if it\'s animating properly.');
        }

        function testSingle(type) {
            updateStatus(`Testing ${type} animation individually...`);
            
            if (window.updateLoaderConfig && window.showLoadingAnimation) {
                const config = {
                    enabled: true,
                    animation_type: type,
                    size: 'medium',
                    position: 'center',
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#7c3aed',
                        tertiary: '#f59e0b'
                    },
                    background_opacity: 95,
                    animation_speed: 1.0,
                    blur_backdrop: 10,
                    duration: 0,
                    show_text: true,
                    auto_hide: false
                };
                
                window.updateLoaderConfig(config);
                window.showLoadingAnimation(`Testing ${type} animation...`);
                
                updateStatus(`Full screen loader showing ${type} animation`);
            } else {
                updateStatus('Loader functions not available');
            }
        }

        function showFullLoader(type) {
            testSingle(type);
        }

        function hideFullLoader() {
            if (window.hideLoadingAnimation) {
                window.hideLoadingAnimation();
                updateStatus('Full loader hidden');
            }
        }

        function clearAll() {
            document.getElementById('testGrid').innerHTML = '';
            updateStatus('All tests cleared');
        }

        // Initialize when loader is ready
        function waitForLoader() {
            if (window.loaderReady) {
                updateStatus('✅ Loader ready! Click "Test All Animations" to see individual animations.');
                testAllAnimations(); // Auto-start
            } else {
                setTimeout(waitForLoader, 100);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(waitForLoader, 500);
        });
    </script>
</body>
</html>
