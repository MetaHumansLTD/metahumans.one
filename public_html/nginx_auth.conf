server {
    listen 80;
    listen [::]:80;
    server_name promptengine.one www.promptengine.one;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name promptengine.one www.promptengine.one;

    ssl_certificate     /etc/letsencrypt/live/promptengine.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promptengine.one/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/promptengine.one_access.log;
    error_log  /var/log/nginx/promptengine.one_error.log;

    # FIX: Route verifyToken to PlugNMeet (8080)
    location /api/verifyToken {
        # Ensure Authorization header is passed
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Hide upstream CORS to avoid duplication
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # Disable buffering for Protobuf compatibility
        proxy_buffering off;
        proxy_request_buffering off;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://metahumans.one" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, API-KEY, HASH-SIGNATURE" always;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Explicitly set CORS here
        add_header Access-Control-Allow-Origin "https://metahumans.one" always;
    }

    # LiveKit Proxy
    location /livekit/ {
        proxy_pass http://meta.superhumans.one:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1 {
        proxy_pass http://meta.superhumans.one:11434;
        proxy_set_header Host              "localhost";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
        proxy_buffering off;
        proxy_read_timeout    300s;
        
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://metahumans.one" always;
    }
    
    location /api {
        proxy_pass http://meta.superhumans.one:11434;
        proxy_set_header Host              "localhost";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
        proxy_buffering    off;
        proxy_read_timeout 300s;
        
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://metahumans.one" always;
    }

    location ~ ^/cue-insights/(.+) {
        set $endpoint $1;
        proxy_pass https://metahumans.one/cue-insights/index.php?endpoint=$endpoint;
        proxy_set_header Host              metahumans.one;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Ensure Auth header passed here too
        proxy_set_header Authorization $http_authorization;
        
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://metahumans.one" always;
    }
}
